name: Notify Blog Hub of discussion activity

on:
  discussion_comment:
    types: [created, deleted]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send optional comment hint
        continue-on-error: true
        run: node ./scripts/send-hub-hint.mjs discussion-comment
